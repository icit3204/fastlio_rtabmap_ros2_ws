motion_aware_collision_geometry:
  ros__parameters:
    # R23 prototype is visualization/shadow only. It is not a cmd_vel filter.
    input_cmd_topic: /cmd_vel_nav
    stop_polygon_topic: /collision_monitor/experimental_stop
    slow_polygon_topic: /collision_monitor/experimental_slow

    footprint_x_min: -0.145
    footprint_x_max: 0.755
    footprint_y_min: -0.300
    footprint_y_max: 0.300
    footprint_padding: 0.030
    minimum_turning_radius: 1.750

    stop_horizon_sec: 2.0
    slow_horizon_sec: 5.0
    stop_base_distance: 0.10
    slow_base_distance: 0.15
    stop_max_distance: 0.45
    slow_max_distance: 0.80
    stop_extra_margin: 0.02
    slow_extra_margin: 0.12
    sample_step: 0.025
    command_timeout_sec: 0.25
    zero_speed_epsilon: 0.0001
