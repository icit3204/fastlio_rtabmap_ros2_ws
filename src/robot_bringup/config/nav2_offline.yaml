# Nav2 parameters for offline navigation with obstacle avoidance.
# No real sensors — obstacles come from the static map only (baked in).
# MPPI controller handles local avoidance based on costmap obstacles.

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /Odometry
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 12.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ['progress_checker']
    goal_checker_plugins: ['general_goal_checker']
    controller_plugins: ['FollowPath']
    speed_limit_topic: speed_limit

    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.08
      movement_time_allowance: 25.0

    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.30
      yaw_goal_tolerance: 1.57

    FollowPath:
      plugin: nav2_rotation_shim_controller::RotationShimController
      primary_controller: nav2_mppi_controller::MPPIController
      angular_dist_threshold: 0.45
      angular_disengage_threshold: 0.22
      forward_sampling_distance: 1.0
      rotate_to_heading_angular_vel: 1.4
      max_angular_accel: 3.6
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: false
      time_steps: 48
      model_dt: 0.083333
      batch_size: 900
      iteration_count: 1
      prune_distance: 2.5
      regenerate_noises: false
      visualize: false
      motion_model: DiffDrive
      vx_max: 1.00
      vx_min: 0.00
      vy_max: 0.0
      wz_max: 2.00
      vx_std: 0.32
      vy_std: 0.0
      wz_std: 0.48
      temperature: 0.40
      gamma: 0.02
      transform_tolerance: 0.5
      critics:
        - GoalCritic
        - GoalAngleCritic
        - PathAlignCritic
        - PathFollowCritic
        - ObstaclesCritic
        - TwirlingCritic
      GoalCritic:
        cost_power: 1
        cost_weight: 4.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        cost_power: 1
        cost_weight: 1.2
        threshold_to_consider: 0.5
      PathAlignCritic:
        cost_power: 1
        cost_weight: 4.0
        max_path_occupancy_ratio: 0.2
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 25
        use_path_orientations: false
      PathFollowCritic:
        cost_power: 1
        cost_weight: 9.0
        offset_from_furthest: 8
        threshold_to_consider: 0.5
      ObstaclesCritic:
        cost_power: 1
        repulsion_weight: 2.5
        critical_weight: 30.0
        collision_margin_distance: 0.18
        near_goal_distance: 0.7
        consider_footprint: false
      TwirlingCritic:
        cost_power: 1
        cost_weight: 3.0

# <修改> 离线模式: local_costmap 使用 map 帧并包含 static_layer
# 使 MPPI 能看到静态地图中的障碍物 (无需真实激光雷达)
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: map
      robot_base_frame: base_footprint
      rolling_window: true
      width: 14
      height: 14
      resolution: 0.05
      robot_radius: 0.22
      transform_tolerance: 0.5
      tf_buffer_duration: 5.0
      plugins: ['static_layer', 'clicked_obstacle_layer', 'inflation_layer']
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        map_topic: /map
      clicked_obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: clicked_obstacles
        clicked_obstacles:
          topic: /clicked_obstacle_points
          data_type: PointCloud2
          marking: true
          clearing: false
          obstacle_max_range: 30.0
          obstacle_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 1.6
        inflation_radius: 1.00
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      transform_tolerance: 0.5
      tf_buffer_duration: 5.0
      robot_radius: 0.22
      resolution: 0.05
      track_unknown_space: true
      plugins: ['static_layer', 'clicked_obstacle_layer', 'inflation_layer']
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        map_topic: /map
      clicked_obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: clicked_obstacles
        clicked_obstacles:
          topic: /clicked_obstacle_points
          data_type: PointCloud2
          marking: true
          clearing: false
          obstacle_max_range: 300.0
          obstacle_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 1.6
        inflation_radius: 1.20
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 4.0
    planner_plugins: ['GridBased']
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.20
      use_astar: true
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ['simple_smoother']
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    cycle_frequency: 10.0
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.8
    min_rotational_vel: 0.2
    rotational_acc_lim: 4.0
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    behavior_plugins: ['spin', 'backup', 'drive_on_heading', 'wait']
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    wait:
      plugin: nav2_behaviors/Wait

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [1.00, 0.0, 2.00]
    min_velocity: [0.00, 0.0, -2.00]
    max_accel: [2.60, 0.0, 3.60]
    max_decel: [-2.60, 0.0, -3.60]
    odom_topic: /Odometry
    odom_duration: 0.10
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
