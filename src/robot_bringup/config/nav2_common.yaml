# Suggested location:
#   robot_bringup/config/nav2_common.yaml
#
# Design intent:
# - RTAB-Map publishes /map and map -> odom.
# - FAST-LIO publishes odom -> base_footprint and /Odometry.
# - navigation_launch.py from nav2_bringup is used (NOT amcl/localization_launch.py).
# - global_costmap works in map frame; local_costmap works in odom frame.

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /Odometry
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    # Current-development-chassis authority: forward-only Ackermann.  Never
    # fall back to Humble's default tree, which contains Spin and BackUp.
    default_nav_to_pose_bt_xml: /home/dog/fastlio_rtabmap_ros2_ws/install/robot_bringup/share/robot_bringup/config/ackermann_navigate_to_pose.xml
    default_nav_through_poses_bt_xml: /home/dog/fastlio_rtabmap_ros2_ws/install/robot_bringup/share/robot_bringup/config/ackermann_navigate_through_poses.xml
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_rate_controller_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    odom_topic: /Odometry
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ['progress_checker']
    goal_checker_plugins: ['general_goal_checker']
    controller_plugins: ['FollowPath']
    speed_limit_topic: speed_limit

    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.15
      movement_time_allowance: 15.0

    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 1.0
      yaw_goal_tolerance: 6.28

    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      time_steps: 60              # 增加每条轨迹的点数
      model_dt: 0.05              # 保持0.05 (总预测时长4.0秒)
      batch_size: 200            # 1500 -> 2500 (大幅增加轨迹数量，即点数翻倍)
      iteration_count: 4          # 2 -> 4 (增加优化迭代)
      prune_distance: 1.7
      regenerate_noises: false
      # Visualization-only publishers: /trajectories and
      # /transformed_global_plan. This does not change MPPI control behavior.
      visualize: true
      # Current development MK-mini uses the labmate-derived Ackermann
      # backend.  Keep MPPI inside the already-qualified Gate/bridge limits.
      motion_model: Ackermann
      vx_max: 0.25
      vx_min: 0.0
      vy_max: 0.0
      wz_max: 0.50
      AckermannConstraints:
        # wheelbase=1.0 m and backend max steering=30 deg imply 1.732 m.
        # 1.75 m avoids backend steering saturation and bridge rejection.
        min_turning_r: 1.75
      vx_std: 0.20                # 0.10 -> 0.30 (扩大前后覆盖范围)
      vy_std: 0.0
      wz_std: 0.30                # 0.20 -> 0.50 (扩大转向覆盖范围)
      temperature: 0.40
      gamma: 0.02
      transform_tolerance: 0.5
      critics:
        - GoalCritic
        - GoalAngleCritic
        - PathAlignCritic
        - PathFollowCritic
        - ObstaclesCritic
        - TwirlingCritic
      ObstaclesCritic:
        # Match the authoritative non-circular MK-mini footprint used by the
        # local costmap; Humble otherwise defaults this critic to point/circle.
        consider_footprint: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 5.0
      # Ground-robot rolling costmap authority. FAST-LIO odom is aligned to
      # its initial sensor/IMU body; odom_chassis is the calibrated, fixed
      # chassis-horizontal sibling used for planar navigation.
      global_frame: odom_chassis
      robot_base_frame: base_footprint
      rolling_window: true
      width: 8
      height: 8
      resolution: 0.05
      # robot_radius: 0.55
      # MK-mini: rear-axle base origin, +0.755 m measured front edge,
      # 0.900 x 0.600 m chassis envelope.
      footprint: "[[ 0.755, 0.300 ],[ 0.755, -0.300 ],[-0.145, -0.300 ],[-0.145, 0.300 ]]"
      footprint_padding: 0.03
      transform_tolerance: 0.5
      tf_buffer_duration: 5.0
      plugins: ['tmini_obstacle_layer', 'mid360_obstacle_layer', 'inflation_layer']
      tmini_obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_persistence: 0.0
        observation_sources: "tmini_scan"
        tmini_scan:
          topic: /scan
          data_type: LaserScan
          inf_is_valid: true
          clearing: true
          marking: true
          min_obstacle_height: 0.0
          max_obstacle_height: 1.6
          raytrace_min_range: 0.0
          raytrace_max_range: 3.5
          obstacle_min_range: 0.0
          obstacle_max_range: 3.0
      mid360_obstacle_layer:
        plugin: spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer
        enabled: true
        # Filtered MID observations refresh at ~10 Hz. A one-second linear
        # decay clears removed/occluded live objects without a manual service;
        # Collision Monitor remains the independent final stop authority.
        voxel_decay: 1.0
        decay_model: 0
        voxel_size: 0.05
        track_unknown_space: false
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: false
        transform_tolerance: 0.5
        mapping_mode: false
        observation_sources: "mid360_marking"
        mid360_marking:
          topic: /cloud_registered_nav2_obstacles
          sensor_frame: body
          data_type: PointCloud2
          clearing: false
          marking: true
          min_obstacle_height: 0.15
          max_obstacle_height: 1.60
          obstacle_range: 3.00
          expected_update_rate: 0.0
          observation_persistence: 0.0
          filter: passthrough
          voxel_min_points: 0
          clear_after_reading: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.65
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      transform_tolerance: 0.5
      tf_buffer_duration: 5.0
      # Use the same authoritative MK-mini envelope as the local costmap:
      # rear-axle base origin, +0.755 m physical front edge.
      footprint: "[[ 0.755, 0.300 ],[ 0.755, -0.300 ],[-0.145, -0.300 ],[-0.145, 0.300 ]]"
      footprint_padding: 0.03

      resolution: 0.05
      track_unknown_space: true
      # Saved RTAB-Map occupancy remains the static planning authority.  Add
      # both qualified T-mini scan and the R22 filtered MID branch as live
      # dynamic-obstacle overlays. Collision Monitor remains the independent
      # final proximity stop layer.
      plugins: ['static_layer', 'tmini_obstacle_layer', 'mid360_obstacle_layer', 'inflation_layer']
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        map_topic: /map
      tmini_obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_persistence: 0.0
        observation_sources: "tmini_scan"
        tmini_scan:
          topic: /scan
          data_type: LaserScan
          inf_is_valid: true
          clearing: true
          marking: true
          min_obstacle_height: 0.0
          max_obstacle_height: 1.6
          raytrace_min_range: 0.0
          raytrace_max_range: 3.5
          obstacle_min_range: 0.0
          obstacle_max_range: 3.0
      mid360_obstacle_layer:
        plugin: spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer
        enabled: true
        voxel_decay: 1.0
        decay_model: 0
        voxel_size: 0.05
        track_unknown_space: false
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: false
        transform_tolerance: 0.5
        mapping_mode: false
        observation_sources: "mid360_marking"
        mid360_marking:
          topic: /cloud_registered_nav2_obstacles
          sensor_frame: body
          data_type: PointCloud2
          clearing: false
          marking: true
          min_obstacle_height: 0.15
          max_obstacle_height: 1.60
          obstacle_range: 3.00
          expected_update_rate: 0.0
          observation_persistence: 0.0
          filter: passthrough
          voxel_min_points: 0
          clear_after_reading: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.65
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 10.0
    planner_plugins: ['GridBased']
    GridBased:
      # Navfn is a grid planner with no vehicle curvature contract. The
      # current development MK-mini is forward-only Ackermann at this layer.
      plugin: nav2_smac_planner/SmacPlannerHybrid
      tolerance: 0.25
      downsample_costmap: false
      allow_unknown: false
      max_iterations: 1000000
      max_planning_time: 5.0
      motion_model_for_search: DUBIN
      angle_quantization_bins: 72
      minimum_turning_radius: 1.75
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 7.0
      smooth_path: true
      allow_unknown: false

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ['simple_smoother']
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    cycle_frequency: 10.0
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.2
    min_rotational_vel: 0.2
    rotational_acc_lim: 3.2
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    # No motion behavior server action is authorized for the current
    # forward-only Ackermann chassis. Humble behaviors publish directly to
    # cmd_vel and would bypass the canonical /cmd_vel_nav -> CM -> Gate path.
    # The selected BT uses planner/controller plus costmap services only, and
    # the MK2F3 stationary launch does not start behavior_server.
    behavior_plugins: ['wait']
    wait:
      plugin: nav2_behaviors/Wait

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.50, 0.0, 1.50]
    min_velocity: [-0.20, 0.0, -1.50]
    max_accel: [1.50, 0.0, 2.50]
    max_decel: [-1.50, 0.0, -2.50]
    odom_topic: /Odometry
    odom_duration: 0.10
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
