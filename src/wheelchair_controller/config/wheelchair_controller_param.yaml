wheelchair_controller_node:
  ros__parameters:
    'output_transport': 'can'        # can=JETSON 直接 SocketCAN 控制；udp=兼容旧下位机 UDP 控制
    'target_ip': '10.42.0.1'         # 轮椅控制板 IP
    'target_port': 9999              # 轮椅控制板端口
    'auto_start': false              # false 时需要在节点终端按空格启动/暂停
    'min_command_interval_ms': 20.0  # 接收 /wheelchair_control_command 的最小间隔，单位毫秒
    'command_timeout_ms': 500.0      # 超过该时间没有新指令时，CAN 输出一次停止帧

    # SocketCAN 参数。CAN 口应提前配置为 can0, 500000 bitrate。
    'can_interface': 'can0'
    'can_frame_id': 416035536        # 0x18C4D2D0，MK-mini ctrl_cmd 扩展帧 ID
    'can_velocity_limit': 16380      # 下发速度的绝对限幅(mm/s)
    'can_wheel_half_track_mm': 300.0 # 兼容保留；MK-mini Ackermann 编码不使用
    'can_straight_radius_threshold_mm': 10000.0
    'can_min_turn_radius_mm': 1000.0
    'can_invert_radius': true        # 复刻旧 UDP 下位机逻辑：收到非直行半径后先取反
    'can_send_period_ms': 20.0       # CAN 保持帧发送周期
    'can_use_command_distance': false
    'can_default_distance': 0
    'wheelbase_mm': 1000.0
    'max_steer_angle_deg': 30.0
