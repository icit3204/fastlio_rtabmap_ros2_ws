    status: "SOURCE_DERIVED_VERIFIED_BY_MANUFACTURER_GEOMETRY"
    note: "Equivalent manufacturer IMU origin in native LiDAR coordinates is [+0.011, +0.02329, -0.04412] m. This is internal sensor geometry, not chassis mounting."
  livox_driver_install_attitude:
    translation_m: [0.0, 0.0, 0.0]
    rotation_rpy_deg: [0.0, 28.5, 0.0]
    source: "src/livox_ros_driver2/config/MID360_config.json"
