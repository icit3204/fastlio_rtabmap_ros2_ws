  angle_units: "degrees"

frame_definitions:
  body:
    physical_definition: "MID-360 built-in IMU origin and IMU-state axes used by FAST-LIO"
    evidence: "FAST-LIO publishes odom -> body and transforms LiDAR points into the IMU frame for /cloud_registered_body."
  base_link:
    physical_definition: "Midpoint between the left and right drive-wheel axle centres"
    orientation: "REP-103 chassis axes"
    convention_status: "PHASE5_CHASSIS_CALIBRATION_CONVENTION_ACCEPTED_BY_OPERATOR"
  base_footprint:
    physical_definition: "Vertical projection of base_link onto the flat ground-contact plane"
    longitudinal_reference: "drive-wheel axle-centre plane"
    lateral_reference: "midpoint between left and right drive-wheel axle centres"
    ground_reference: "flat floor beneath the normally loaded, unoccupied wheelchair"
    orientation: "same as base_link"
  livox_frame:
    physical_definition: "Native MID-360 point-cloud frame O-XYZ"
    origin: "Sensor centreline, 47 mm above the bottom mounting surface"
    axes: "Native manufacturer axes shown in the MID-360 user manual"
    note: "This physical frame is distinct from any virtual point frame produced by driver-side install-attitude correction."

measurement_uncertainty:
  direct_translation_m: 0.005
  direct_rotation_deg: 1.0
  derived_body_to_base_footprint_translation_m: 0.030
  derived_body_to_base_footprint_rotation_deg: 1.0
  rationale: "Derived translation conservatively includes direct tape uncertainty and orientation uncertainty propagated through the approximately 1.44 m body-to-ground lever arm."

