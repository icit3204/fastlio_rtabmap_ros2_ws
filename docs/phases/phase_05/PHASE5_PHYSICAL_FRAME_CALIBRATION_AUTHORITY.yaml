extrinsic_reconciliation:
  double_application_risk: "HIGH_IN_CURRENT_CONFIGURATION"
  finding: "The +28.5 degree physical mount is represented by the measured base_link -> native livox_frame transform and is also configured as Livox driver install attitude. FAST-LIO initially assumes parallel LiDAR/IMU axes while consuming point and IMU streams under livox_frame semantics."
  accepted_physical_authority: "base_link -> native livox_frame includes +28.5 degree pitch exactly once"
  required_p5_0c_configuration_action: "Represent the physical pitch in the static chassis-to-native-sensor transform and prevent driver-side point correction from applying the same mounting rotation a second time. Verify point/IMU frame semantics statically before launch."
  configuration_changed_by_p5_0c0: false
  runtime_validation_required: true

