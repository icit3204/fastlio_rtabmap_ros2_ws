# ── Conflict register ──
conflict_register:
  - id: "CONFLICT-001"
    field: "transforms.TF03.translation.z (body->base_footprint)"
    source_a: "record_bag_infra.launch.py: z=-1.5"
    source_b: "fast_lio2.launch.py: z=0"
    impact: "Nav2 costmap, Collision Monitor, and robot footprint all depend on correct base_footprint frame height. Wrong value causes incorrect obstacle projection and false collision stops."
    resolution_required_by: "Phase 5 (live sensor phase per authority)"
    resolution_method: "Physical measurement of FAST-LIO body-frame origin height above ground plane. Select authoritative launch file and remove conflicting value."
    resolved: false

# ── Verification plan ──
verification_plan:
  - step: "V01"
    description: "Physical measurement of body->base_footprint z offset"
    phase: "Phase 5"
    method: "Measure vertical distance from FAST-LIO body-frame origin to ground-contact plane. Compare with both source values."
    pass_criterion: "Single measured value recorded; conflicting launch file value removed."

  - step: "V02"
    description: "TF source-authority check"
    phase: "Phase 5"
    method: "Verify only one authoritative static_transform_publisher exists per child frame in active bringup launch."
    pass_criterion: "No duplicate TF publishers in active bringup; all static transforms have measured source."

  - step: "V03"
    description: "MID-360 mounting measurement"
    phase: "Phase 5"
    method: "Physically measure MID-360 position and orientation relative to base_link."
    pass_criterion: "All 6 DOF recorded with measurement uncertainty; TF05 completed."

  - step: "V04"
    description: "Wheelchair footprint measurement"
    phase: "Phase 5"
    method: "Measure physical wheelchair bounding box. Compare with Collision Monitor polygon."
    pass_criterion: "Footprint polygon verified against physical dimensions within ±5cm."

  - step: "V05"
    description: "Track and wheelbase measurement"
    phase: "Phase 5"
    method: "Physically measure wheel half-track and minimum turn radius."
    pass_criterion: "Measured values replace SOURCE_DEFAULT_UNVERIFIED in kinematics."

  - step: "V06"
    description: "Camera intrinsic/extrinsic calibration"
    phase: "Camera validation phase (later)"
    method: "Standard camera calibration procedure."
    pass_criterion: "Intrinsic matrix and distortion coefficients recorded; camera-to-base extrinsics measured."

  - step: "V07"
    description: "YDLIDAR extrinsic calibration"
    phase: "If YDLIDAR retained (later)"
    method: "Physical measurement of YDLIDAR mounting relative to base_link."
    pass_criterion: "YDLIDAR TF recorded; verified against scan alignment with known geometry."

  - step: "V08"
    description: "Checksum and version update"
    phase: "After any measurement"
    method: "Update manifest version, record SHA256 of measured source evidence, update last_verified_date and operator."
    pass_criterion: "Manifest version incremented; all changed fields have updated status and evidence."

# ── Change-control policy ──
change_control:
  version_increment_rule: "Increment manifest_version minor on any status change from UNKNOWN/CONFLICTING to MEASURED. Increment major on robot-model or chassis change."
  approval_required: "Physical measurement values must be verified by a second person or reference measurement."
  review_phase: "After each physical measurement phase (Phase 5, camera phase, YDLIDAR phase)."
  archival: "Previous manifest versions retained in Git history."
